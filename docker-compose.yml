services:
  app:
    build: .
    image: wishlist-famille:local
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3187}:3000"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Administrateur}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définissez un mot de passe initial dans .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3187}
      TZ: Europe/Paris
    volumes:
      - ./data:/app/data
